name: Tideline
options:
  bundleIdPrefix: com.carliderzerstoere
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Tideline:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tideline/Sources
      - path: Tideline/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carliderzerstoere.tideline
        PRODUCT_NAME: Tideline
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Tideline reads your cycle and wrist-temperature data from Apple Health to give you private, on-device summaries. Your data never leaves your phone."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Tideline writes the period days you log back to Apple Health so your data stays in your own ecosystem."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: Tideline/Resources/Tideline.entitlements
      properties:
        com.apple.developer.healthkit: true

  TidelineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tideline/Tests
    dependencies:
      - target: Tideline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carliderzerstoere.tideline.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tideline:
    build:
      targets:
        Tideline: all
        TidelineTests: [test]
    test:
      targets:
        - TidelineTests
    run:
      config: Debug
    archive:
      config: Release
