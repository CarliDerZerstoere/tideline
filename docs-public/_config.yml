# GitHub Pages config for Tideline's public-facing site.
#
# This site exists ONLY to satisfy Apple's App Store Connect requirement
# that a privacy policy URL and support URL resolve to real pages. It's
# intentionally minimal — no marketing site, no blog, no telemetry.
#
# To publish:
#   1. Push this folder to the repo's default branch.
#   2. Repo Settings → Pages → Source: "Deploy from a branch" → branch
#      `main`, folder `/docs-public`. Save.
#   3. Wait ~5–10 min. The URL is then
#      https://carliderzerstoere.github.io/tideline/
#      (or similar, depending on repo name).
#   4. Paste the resolved URL into App Store Connect.

title: Tideline
description: >-
  Privater, ehrlicher Zyklus-Tracker für iOS. Alle Daten bleiben auf
  deinem Gerät. Keine Konten, keine Cloud, keine Analytics.
lang: de
theme: minima
# `minima` is GitHub Pages' lightest built-in theme; no JS, minimal CSS.
# No theme customisation here — content first, polish later if needed.

# No collections, no plugins, no analytics. The site renders three pages
# (index, privacy, support) and that's it.

# Don't crawl the rest of the repo when building.
include:
  - index.md
  - privacy.md
  - support.md
exclude:
  - README.md
